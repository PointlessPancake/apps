resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

ayakaleaf:
  invite_token_secret: test_invite_token_secret_0123456789
  redis_password: test_redis_password
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

ix_volumes:
  data: /opt/tests/mnt/ayakaleaf-pro/data
  mongodb_data: /opt/tests/mnt/ayakaleaf-pro/mongodb_data
  redis_data: /opt/tests/mnt/ayakaleaf-pro/redis_data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  mongodb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mongodb_data
      create_host_path: true
  redis_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: redis_data
      create_host_path: true
  additional_storage: []
