{% set tpl = ix_lib.base.render.Render(values) %}

{% set internal_net = tpl.networks.create_internal("ayakaleaf-net") %}

{% set c1 = tpl.add_container(values.consts.ayakaleaf_container_name, "image") %}
{% do c1.add_network(internal_net) %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}

{# MongoDB, Ayakaleaf Pro needs a replica set for transactions #}
{% set mongodb = tpl.add_container(values.consts.mongodb_container_name, "mongodb_image") %}
{% set mongodb_host = "%s:%d" | format(values.consts.mongodb_container_name, values.consts.mongodb_port) %}
{% set rs_init = "rs.initiate({_id: '%s', members: [{_id: 0, host: '%s'}]})" | format(values.consts.mongodb_replica_set, mongodb_host) %}
{% do mongodb.add_network(internal_net) %}
{% do mongodb.set_user(568, 568) %}
{% do mongodb.set_command(["--replSet", values.consts.mongodb_replica_set, "--port", values.consts.mongodb_port | string]) %}
{% do mongodb.healthcheck.set_custom_test([
  "CMD", "mongosh", "--quiet", "--port", values.consts.mongodb_port | string, "--eval",
  "try { rs.status() } catch (e) { %s }; quit(db.hello().isWritablePrimary ? 0 : 1)" | format(rs_init),
]) %}
{% do mongodb.remove_devices() %}
{% do mongodb.set_grace_period(60) %}
{% do mongodb.add_storage("/data/db", values.storage.mongodb_data) %}
{% do perms.add_or_skip_action("mongodb_data", values.storage.mongodb_data, {"uid": 568, "gid": 568, "mode": "check"}) %}

{# Redis #}
{% set redis_config = {"password": values.ayakaleaf.redis_password, "volume": values.storage.redis_data} %}
{% set redis = tpl.deps.redis(values.consts.redis_container_name, "redis_image", redis_config, perms) %}
{% do redis.container.add_network(internal_net) %}

{% do c1.set_user(0, 0) %}
{% do c1.add_caps(["CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "NET_BIND_SERVICE", "SETGID", "SETUID"]) %}
{% do c1.healthcheck.set_test("curl", {"port": values.consts.internal_web_port, "path": "/status"}) %}
{% do c1.healthcheck.set_start_period(120) %}
{% do c1.set_grace_period(60) %}
{% do c1.depends.add_dependency(values.consts.mongodb_container_name, "service_healthy") %}
{% do c1.depends.add_dependency(values.consts.redis_container_name, "service_healthy") %}

{% do c1.environment.add_env("OVERLEAF_APP_NAME", values.ayakaleaf.app_name) %}
{% if values.ayakaleaf.site_url %}
  {% do c1.environment.add_env("OVERLEAF_SITE_URL", values.ayakaleaf.site_url) %}
{% endif %}
{% if values.ayakaleaf.admin_email %}
  {% do c1.environment.add_env("OVERLEAF_ADMIN_EMAIL", values.ayakaleaf.admin_email) %}
{% endif %}
{% do c1.environment.add_env("OVERLEAF_INVITE_TOKEN_SECRET", values.ayakaleaf.invite_token_secret) %}
{% do c1.environment.add_env("OVERLEAF_MONGO_URL", "mongodb://%s/%s" | format(mongodb_host, values.consts.mongodb_database)) %}
{# Some services read the REDIS_* variables instead of the OVERLEAF_REDIS_* ones #}
{% for prefix in ["OVERLEAF_REDIS", "REDIS"] %}
  {% do c1.environment.add_env("%s_HOST" | format(prefix), values.consts.redis_container_name) %}
  {% do c1.environment.add_env("%s_PORT" | format(prefix), redis.get_port()) %}
{% endfor %}
{% do c1.environment.add_env("OVERLEAF_REDIS_PASS", values.ayakaleaf.redis_password) %}
{% do c1.environment.add_env("REDIS_PASSWORD", values.ayakaleaf.redis_password) %}
{% do c1.environment.add_user_envs(values.ayakaleaf.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}

{% do c1.add_storage("/var/lib/overleaf", values.storage.data) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do mongodb.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do redis.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}
{% do tpl.notes.set_body(values.consts.notes_body) %}

{{ tpl.render() | tojson }}
