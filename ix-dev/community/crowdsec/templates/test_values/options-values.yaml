resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

crowdsec:
  collections:
    - crowdsecurity/nginx
    - crowdsecurity/traefik
  disable_online_api: true
  enroll_key: ""
  enroll_instance_name: ""
  bouncers:
    - name: traefik
      key: traefik_bouncer_test_key_0123456789
  additional_envs: []

network:
  lapi_port:
    bind_mode: published
    port_number: 8080
  metrics_port:
    bind_mode: published
    port_number: 8081
  appsec_port:
    bind_mode: published
    port_number: 8082

ix_volumes:
  config: /opt/tests/mnt/crowdsec/config
  data: /opt/tests/mnt/crowdsec/data

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: host_path
      read_only: true
      mount_path: /var/log/host
      host_path_config:
        path: /opt/tests/mnt/crowdsec/logs
        create_host_path: true
